name: CDK CI/CD

on:
  push:
    branches: main
  pull_request:
    branches: main

jobs:
  test-cdk:
    concurrency:
      group: test-cdk-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: ./cdk

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: "cdk/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run build

      - name: Lint
        run: npm run lint:ci

      - name: Check formatting
        run: npm run format:ci

      - name: Run tests
        run: npm test

      - name: cdk synth
        run: npm run cdk:synth
        env:
          LOG_LEVEL: INFO
          CDK_DEFAULT_ACCOUNT: "000000000000"
          CDK_DEFAULT_REGION: us-west-2

  deploy:
    concurrency:
      group: deploy-cdk
      cancel-in-progress: false
    needs: test-cdk
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04-arm
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: ./cdk

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: "cdk/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials from OIDC
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-duration-seconds: 1800
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-west-2

      - name: Deploy
        run: npm run cdk:deploy:ci
        env:
          NOTIFICATION_EMAILS: ${{ vars.NOTIFICATION_EMAILS }}
          SCHEDULES: ${{ vars.SCHEDULES }}
          MODEL_PROVIDER: ${{ vars.MODEL_PROVIDER }}
          BEDROCK_MODEL_ID: ${{ vars.BEDROCK_MODEL_ID }}
          ANTHROPIC_MODEL_ID: ${{ vars.ANTHROPIC_MODEL_ID }}
          STACK_NAME: ${{ vars.STACK_NAME }}
