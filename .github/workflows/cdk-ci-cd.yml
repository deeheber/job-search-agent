name: CDK CI/CD

on:
  push:
    branches: main
  pull_request:
    branches: main

jobs:
  test-cdk:
    concurrency:
      group: test-cdk-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./cdk

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: "cdk/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run build

      - name: Lint
        run: npm run lint:ci

      - name: Check formatting
        run: npm run format:ci

      - name: Run tests
        run: npm test

      - name: cdk synth
        run: npm run cdk:synth
        env:
          LOG_LEVEL: INFO
          CDK_DEFAULT_ACCOUNT: "000000000000"
          CDK_DEFAULT_REGION: us-west-2

  deploy:
    concurrency:
      group: deploy-cdk
      cancel-in-progress: false
    needs: test-cdk
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04-arm
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: ./cdk

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: "cdk/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials from OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          mask-aws-account-id: true
          role-duration-seconds: 1800
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-west-2

      - name: Deploy
        run: npm run cdk:deploy:ci
        env:
          NOTIFICATION_EMAILS: ${{ vars.NOTIFICATION_EMAILS }}
          SCHEDULES: ${{ vars.SCHEDULES }}
          MODEL_PROVIDER: ${{ vars.MODEL_PROVIDER }}
          BEDROCK_MODEL_ID: ${{ vars.BEDROCK_MODEL_ID }}
          ANTHROPIC_MODEL_ID: ${{ vars.ANTHROPIC_MODEL_ID }}
          STACK_NAME: ${{ vars.STACK_NAME }}
