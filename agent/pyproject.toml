[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "job-search-agent"
version = "0.0.1"
description = "A Strands AI agent"
requires-python = ">=3.13"
dependencies = [
    "strands-agents[otel]>=1.41.0",
    "strands-agents-tools>=0.7.0",
    "bedrock-agentcore>=1.12.0",
    "aws-opentelemetry-distro>=0.17.1",
    "boto3>=1.43.18"
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.15",
    "mypy>=2.1.0",
    "black>=26.5.1",
    "boto3-stubs[ssm]>=1.43.18",
]

[tool.uv]
required-version = "~=0.11.0"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
