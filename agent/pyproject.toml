[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "job-search-agent"
version = "2.0.0"
description = "A Strands AI agent"
requires-python = ">=3.14.9"
dependencies = [
    "strands-agents[otel,anthropic]~=1.62",
    "strands-agents-tools~=0.8.10",
    "bedrock-agentcore~=1.25",
    "aws-opentelemetry-distro~=0.21",
    "boto3~=1.43.118",
]

[dependency-groups]
dev = [
    "pytest~=9.1",
    "ruff~=0.17",
    "mypy~=2.4",
    "boto3-stubs[ssm,sns]~=1.43.118",
]

[tool.uv]
required-version = "~=0.13.5"
# Strands caps MCP below the fixed 2.2 release; use the patched 1.x line.
constraint-dependencies = ["mcp>=1.30,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/agentcore_app.py" = ["E501"]
